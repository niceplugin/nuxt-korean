  title: 단순하고 강력한 웹 앱을 위한 개발자들의 선택
  description: |
    Nuxt는 생산성 및 플랫폼 성능을 향상하기 위해 개발자의 필요에서 탄생했습니다.
    Vue 기반 자동화 및 서버 사이드 렌더링 솔루션으로 시작된 Nuxt는 이제 전 세계 스타트업과 엔터프라이즈에서 신뢰받고 있습니다.
