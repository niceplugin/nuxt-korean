features:
  title: 필요한 것은 모두, 복잡함은 최소로
  description: Nuxt가 아키텍처를 맡고, 여러분은 제품 개발에 집중할 수 있습니다.
  features:
    - icon: i-lucide-sparkles
      title: 설정 최소화
      description: Vue와 TypeScript 코딩을 바로 시작하세요. Nuxt가 초기 설정을 대신 처리합니다.
    - icon: i-lucide-file-code-2
      title: 다양한 렌더링 모드
      description: SSR, CSR, 정적 생성까지 페이지 단위로 원하는 방식으로 선택할 수 있습니다.
    - icon: i-lucide-milestone
      title: 라우팅과 레이아웃
      description: 파일 기반 라우팅으로 복잡한 화면을 구성하고, 컴포넌트 재사용으로 성능도 챙길 수 있습니다.
    - icon: i-lucide-unplug
      title: 데이터 패칭
      description: 컴포넌트를 async로 만들고 데이터를 await 하세요. 범용 데이터 패칭용 강력한 컴포저블이 제공됩니다.
    - icon: i-lucide-bug
      title: 에러 처리
      description: 내장 핸들러와 커스텀 에러 페이지로 애플리케이션 오류를 안정적으로 처리할 수 있습니다.
    - icon: i-lucide-flip-horizontal
      title: 트랜지션
      description: 레이아웃, 페이지, 컴포넌트 전환을 부드럽게 구성할 수 있습니다.
    - icon: i-lucide-image
      title: 에셋과 스타일
      description: 이미지, 폰트, 스크립트 최적화를 내장 지원으로 손쉽게 활용할 수 있습니다.
    - icon: i-lucide-file-search
      title: SEO와 메타 태그
      description: 검색 엔진 친화적인 프로덕션급 애플리케이션을 만들 수 있습니다.
    - icon: i-lucide-puzzle
      title: 모듈 확장성
      description: 200개 이상의 모듈로 기능을 빠르게 확장하고 개발 속도를 높일 수 있습니다.
    - icon: i-lucide-shield-check
      title: 미들웨어
      description: 렌더링 전에 인증, 현지화, A/B 테스트 같은 로직을 적용할 수 있습니다.
    - icon: i-simple-icons-typescript
      title: TypeScript 기반 타입 안정성
      description: 자동 생성된 타입과 tsconfig를 바탕으로 안전하게 코드를 작성할 수 있습니다.
  cta:
    title: '이제 Nuxt를 깊이 있게 살펴보세요'
    label: 문서 읽기 시작
    to: /docs
    icon: i-lucide-arrow-right
foundation:
  title: 검증된 도구 위에 구축된 프레임워크
  description: 프런트엔드는 Vue, 서버는 Nitro, 번들러는 원하는 선택지를 사용할 수 있습니다.
  items:
    - id: vue
      title: Vue.js 기반 프런트엔드
      description: Nuxt는 Vue.js 위에 구축되어 반응형 컴포넌트 아키텍처를 바탕으로 강력하고 확장 가능한 웹 앱을 만들 수 있게 합니다.
      logo: i-custom-vue
      color: '#42B883'
      gradient: 'bg-gradient-to-br from-[#42B883]/10 from-5% via-transparent via-50% to-transparent'
      link:
        label: vuejs.org
        to: https://vuejs.org
    - id: bundler
      title: Vite 번들링
      description: Vite의 빠른 번들링과 즉시 반영 HMR로 더 쾌적한 개발 경험을 제공합니다.
      logo: i-custom-vite
      color: '#A156FE'
      gradient: 'bg-gradient-to-br from-[#A156FE]/10 from-5% via-transparent via-50% to-transparent'
      link:
        label: vite.dev
        to: https://vite.dev
    - id: bundler
      title: Webpack 번들링
      description: Webpack의 성숙한 번들링과 최적화 기능으로 안정적이고 확장 가능한 개발 환경을 제공합니다.
      logo: i-custom-webpack
      color: '#8ED6FB'
      gradient: 'bg-gradient-to-br from-[#8ED6FB]/10 from-5% via-transparent via-50% to-transparent'
      link:
        label: webpack.js.org
        to: https://webpack.js.org
    - id: bundler
      title: Rspack 번들링
      description: Rspack의 고성능 번들링으로 빌드와 HMR 속도를 높여 대규모 프로젝트에서도 빠른 개발을 지원합니다.
      logo: i-custom-rspack
      color: '#F93920'
      gradient: 'bg-gradient-to-br from-[#F93920]/10 from-5% via-transparent via-50% to-transparent'
      link:
        label: rspack.dev
        to: https://rspack.dev
    - id: nitro
      title: Nitro 기반 서버 엔진
      description: Nuxt는 Nitro를 서버 엔진으로 사용해 어떤 플랫폼에도 배포 가능한 풀스택 웹 앱을 구축합니다.
      logo: i-custom-nitro
      color: '#FB848E'
      gradient: 'bg-gradient-to-br from-[#FB848E]/10 from-5% via-transparent via-50% to-transparent'
      link:
        label: nitro.build
        to: https://nitro.build
modules:
  title: 플러그 앤 플레이 모듈로 Nuxt 확장하기
  description: 공식 모듈과 커뮤니티 모듈이 풍부하게 준비되어 있어, 자주 필요한 기능을 더 빠르게 도입할 수 있습니다.
  links:
    - label: 모든 모듈 둘러보기
