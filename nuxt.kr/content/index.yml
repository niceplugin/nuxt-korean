features:
  title: 성장 단계에 맞춰 기능 확장
  description: Nuxt는 뛰어난 개발자 경험과 함께 필요에 맞게 확장되도록 설계되었습니다. 간단한 랜딩 페이지부터 개발자 수백 명 규모의 복잡한 웹 애플리케이션까지 구축할 수 있습니다.
  features:
    - icon: i-lucide-sparkles
      title: 제로 구성
      description: Vue 또는 TypeScript로 즉시 코딩을 시작하십시오 — Nuxt가 모든 설정을 처리합니다.
    - icon: i-lucide-file-code-2
      title: 렌더링 모드
      description: 서버 사이드 렌더링, 클라이언트 사이드 렌더링, 정적 사이트 생성까지 페이지 단위로 원하는 방식을 선택할 수 있습니다.
    - icon: i-lucide-milestone
      title: 라우팅 & 레이아웃
      description: 파일 기반 라우팅 시스템을 활용해 복잡한 URL 기반 뷰를 구축하고 구성 요소를 재사용하여 성능을 최적화하십시오.
    - icon: i-lucide-unplug
      title: 데이터 패칭
      description: Vue 컴포넌트를 async로 만들고 데이터를 기다리십시오. Nuxt는 범용 데이터 패칭을 위한 강력한 composable을 제공합니다.
    - icon: i-lucide-bug
      title: 오류 처리
      description: 내장 핸들러와 사용자 정의 오류 페이지로 애플리케이션 오류를 추적하고 처리하십시오.
    - icon: i-lucide-flip-horizontal
      title: 전환 효과
      description: 레이아웃, 페이지, 컴포넌트 간 부드러운 전환을 구현하십시오.
    - icon: i-lucide-image
      title: 에셋 & 스타일
      description: 자동 이미지, 폰트, 스크립트 최적화를 통해 더욱 효율적으로 작업하십시오.
    - icon: i-lucide-file-search
      title: SEO & 메타 태그
      description: 검색 엔진에서 완전히 색인될 수 있는 프로덕션 준비 완료 애플리케이션을 생성하십시오.
    - icon: i-lucide-puzzle
      title: 모듈형 구조
      description: 200개 이상의 모듈로 Nuxt 기능을 확장하여 개발 속도를 높이십시오.
    - icon: i-lucide-shield-check
      title: 미들웨어
      description: 페이지 렌더링 전에 보호 규칙 또는 사용자 정의 로직(현지화, A/B 테스트 등)을 추가하십시오.
    - icon: i-simple-icons-typescript
      title: TypeScript 기반 타입 안정성
      description: 자동 생성되는 타입과 tsconfig.json으로 타입 안전한 코드를 작성하십시오.
  cta:
    title: '지금 바로 Nuxt 깊이 알아보기'
    label: 문서 읽기 시작
    to: /docs
    icon: i-lucide-arrow-right
foundation:
  title: 견고한 기반 위에 구축됨
  description: Nuxt는 뛰어난 품질의 오픈 소스 기술 위에 구축되었으며, 다양한 빌드 도구 중에서 선택할 수 있는 유연성을 제공합니다.
  items:
    - id: vue
      title: Vue.js 기반 프론트엔드
      description: Nuxt는 Vue.js 위에 구축되어 반응형 컴포넌트 아키텍처를 활용해 강력하고 확장 가능한 웹 애플리케이션을 제공합니다.
      logo: i-custom-vue
      color: '#42B883'
      gradient: 'bg-gradient-to-br from-[#42B883]/10 from-5% via-transparent via-50% to-transparent'
      link:
        label: vuejs.org
        to: https://vuejs.org
    - id: bundler
      title: Vite 기반 번들러
      description: Nuxt는 Vite의 프론트엔드 빌드 기능을 활용하여 즉각적인 HMR과 빠른 개발 경험을 제공합니다.
      logo: i-custom-vite
      color: '#A156FE'
      gradient: 'bg-gradient-to-br from-[#A156FE]/10 from-5% via-transparent via-50% to-transparent'
      link:
        label: vite.dev
        to: https://vite.dev
    - id: bundler
      title: Webpack 기반 번들러
      description: Nuxt는 Webpack의 강력한 번들링 및 최적화 기능을 활용하여 안정적이고 확장 가능한 개발 경험을 제공합니다.
      logo: i-custom-webpack
      color: '#8ED6FB'
      gradient: 'bg-gradient-to-br from-[#8ED6FB]/10 from-5% via-transparent via-50% to-transparent'
      link:
        label: webpack.js.org
        to: https://webpack.js.org
    - id: bundler
      title: Rspack 기반 번들러
      description: Nuxt는 Rspack의 고성능 번들링을 통합하여 대규모 개발 환경에서 빌드 및 HMR을 가속화합니다.
      logo: i-custom-rspack
      color: '#F93920'
      gradient: 'bg-gradient-to-br from-[#F93920]/10 from-5% via-transparent via-50% to-transparent'
      link:
        label: rspack.dev
        to: https://rspack.dev
    - id: nitro
      title: Nitro 서버 엔진
      description: Nuxt는 Nitro를 서버 엔진으로 사용하여 모든 플랫폼에서 배포 가능한 범용 풀스택 웹 애플리케이션을 구축합니다.
      logo: i-custom-nitro
      color: '#FB848E'
      gradient: 'bg-gradient-to-br from-[#FB848E]/10 from-5% via-transparent via-50% to-transparent'
      link:
        label: nitro.build
        to: https://nitro.build
modules:
  title: 플러그 앤 플레이 모듈로 Nuxt 확장
  description: Nuxt는 공식 및 커뮤니티 기반 모듈 생태계를 갖추고 있어 공통 기능을 빠르게 구현할 수 있도록 도와줍니다.
  links:
